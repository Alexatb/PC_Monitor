<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PC Monitor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .status {
            margin-top: 8px;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .percentage {
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
        }

        .bar {
            width: 100%;
            height: 12px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width 0.5s;
        }

        .details {
            margin-top: 12px;
            color: #666;
            font-size: 14px;
        }

        /* Process list */

        .process-card {
            margin-top: 20px;
        }

        .process {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .process:last-child {
            border-bottom: none;
        }

        .process-name {
            font-weight: bold;
        }

        .process-memory {
            color: #666;
        }

        /* Power buttons */

        .power-card {
            margin-top: 20px;
        }

        .lock-button,
        .shutdown-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .lock-button {
            background: #2563eb;
            margin-bottom: 10px;
        }

        .shutdown-button {
            background: #dc2626;
        }

        .lock-button:active,
        .shutdown-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>🖥️ PC Monitor</h1>

        <div class="status">
            ● Live monitoring
        </div>

    </div>


    <div class="container">


        <!-- PC INFORMATION -->

        <div class="card">

            <h2>🖥️ PC Information</h2>

            <div class="details">

                <p>
                    <strong>Computer:</strong>
                    <span id="computer-name">Loading...</span>
                </p>

                <p>
                    <strong>Windows:</strong>
                    <span id="windows-version">Loading...</span>
                </p>

                <p>
                    <strong>CPU:</strong>
                    <span id="cpu-model">Loading...</span>
                </p>

                <p>
                    <strong>Cores:</strong>
                    <span id="cpu-cores">Loading...</span>
                </p>

                <p>
                    <strong>Uptime:</strong>
                    <span id="uptime">Loading...</span>
                </p>

                <p>
                    <strong>IP Address:</strong>
                    <span id="ip-address">Loading...</span>
                </p>

            </div>

        </div>


        <!-- CPU / RAM / DISK -->

        <div class="cards">


            <!-- CPU -->

            <div class="card">

                <h2>⚙️ CPU</h2>

                <div class="percentage" id="cpu">
                    0%
                </div>

                <div class="bar">

                    <div
                        class="progress"
                        id="cpu-bar">
                    </div>

                </div>

                <div class="details">
                    Processor usage
                </div>

            </div>


            <!-- RAM -->

            <div class="card">

                <h2>🧠 RAM</h2>

                <div class="percentage" id="ram">
                    0%
                </div>

                <div class="bar">

                    <div
                        class="progress"
                        id="ram-bar">
                    </div>

                </div>

                <div
                    class="details"
                    id="ram-details">

                    Loading...

                </div>

            </div>


            <!-- DISK -->

            <div class="card">

                <h2>💾 Disk</h2>

                <div class="percentage" id="disk">
                    0%
                </div>

                <div class="bar">

                    <div
                        class="progress"
                        id="disk-bar">
                    </div>

                </div>

                <div
                    class="details"
                    id="disk-details">

                    Loading...

                </div>

            </div>


        </div>


        <!-- TOP PROCESSES -->

        <div class="card process-card">

            <h2>
                🧠 Top Memory-Using Programs
            </h2>

            <div id="process-list">

                Loading...

            </div>

        </div>


        <!-- POWER -->

        <div class="card power-card">

            <h2>⚡ Power</h2>


            <!-- LOCK -->

            <button
                onclick="lockPC()"
                class="lock-button">

                🔒 Lock PC

            </button>


            <!-- SHUTDOWN -->

            <button
                onclick="shutdownPC()"
                class="shutdown-button">

                🔴 Shutdown PC

            </button>

        </div>


    </div>


    <script>


        // =========================
        // LOCK PC
        // =========================

        async function lockPC() {

            const confirmed = confirm(
                "Are you sure you want to lock the PC?"
            );

            if (!confirmed) {
                return;
            }

            try {

                const response = await fetch(
                    "/lock",
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();

                console.log(data.message);

            }

            catch (error) {

                console.log(
                    "Lock error:",
                    error
                );

                alert(
                    "Unable to lock the PC."
                );

            }

        }


        // =========================
        // SHUTDOWN PC
        // =========================

        async function shutdownPC() {

            const confirmed = confirm(
                "Are you sure you want to shut down the PC?"
            );

            if (!confirmed) {
                return;
            }

            try {

                const response = await fetch(
                    "/shutdown",
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();

                console.log(data.message);

            }

            catch (error) {

                console.log(
                    "Shutdown error:",
                    error
                );

                alert(
                    "Unable to shut down the PC."
                );

            }

        }


        // =========================
        // UPDATE MONITOR
        // =========================

        async function updateMonitor() {

            try {

                const response =
                    await fetch("/api/status");

                const data =
                    await response.json();


                // =========================
                // PC INFORMATION
                // =========================

                document.getElementById(
                    "computer-name"
                ).textContent =
                    data.computer_name;


                document.getElementById(
                    "windows-version"
                ).textContent =
                    data.windows_version;


                document.getElementById(
                    "cpu-model"
                ).textContent =
                    data.cpu_model;


                document.getElementById(
                    "cpu-cores"
                ).textContent =

                    data.physical_cores +
                    " physical / " +

                    data.logical_processors +
                    " logical";


                document.getElementById(
                    "uptime"
                ).textContent =
                    data.uptime;


                document.getElementById(
                    "ip-address"
                ).textContent =
                    data.ip_address;


                // =========================
                // CPU
                // =========================

                document.getElementById(
                    "cpu"
                ).textContent =
                    data.cpu + "%";


                document.getElementById(
                    "cpu-bar"
                ).style.width =
                    data.cpu + "%";


                // =========================
                // RAM
                // =========================

                document.getElementById(
                    "ram"
                ).textContent =
                    data.ram + "%";


                document.getElementById(
                    "ram-bar"
                ).style.width =
                    data.ram + "%";


                document.getElementById(
                    "ram-details"
                ).textContent =

                    data.ram_used +
                    " GB / " +

                    data.ram_total +
                    " GB";


                // =========================
                // DISK
                // =========================

                document.getElementById(
                    "disk"
                ).textContent =
                    data.disk + "%";


                document.getElementById(
                    "disk-bar"
                ).style.width =
                    data.disk + "%";


                document.getElementById(
                    "disk-details"
                ).textContent =

                    data.disk_used +
                    " GB / " +

                    data.disk_total +
                    " GB";


                // =========================
                // PROCESSES
                // =========================

                const processList =
                    document.getElementById(
                        "process-list"
                    );


                processList.innerHTML = "";


                data.processes.forEach(
                    function (process) {

                        const processElement =
                            document.createElement(
                                "div"
                            );


                        processElement.className =
                            "process";


                        processElement.innerHTML =
                            `

                            <span class="process-name">

                                ${process.name}

                            </span>

                            <span class="process-memory">

                                ${process.memory} MB

                            </span>

                            `;


                        processList.appendChild(
                            processElement
                        );

                    }
                );

            }


            catch (error) {

                console.log(
                    "Monitor error:",
                    error
                );

            }

        }


        // =========================
        // START MONITORING
        // =========================

        updateMonitor();


        // Update every 2 seconds

        setInterval(
            updateMonitor,
            2000
        );


    </script>


</body>

</html>
